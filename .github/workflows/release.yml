name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned Inno Setup release asset (jrsoftware/issrc, tag is-7_1_1); the workflow refuses to
  # execute the installer when the download does not hash to this value.
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          # Publishing is only allowed from a v* tag (a manual dispatch must select the tag too):
          # the release is published under github.ref_name, so a branch or a mismatched tag would
          # publish artifacts whose version disagrees with the tag and with the updater's checks.
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
              throw "Release builds must run from a v* tag, not '$env:GITHUB_REF'."
          }
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
              throw 'Unable to read the package version from Cargo.toml'
          }
          $version = $matches[1]
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") {
              throw "Tag '$tag' does not match the Cargo.toml version '$version' (expected 'v$version')."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building release $tag from $env:GITHUB_REF."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Verify executable version resources
        shell: pwsh
        run: |
          # winres derives the resource versions from Cargo.toml; fail before publishing if the
          # VERSIONINFO the updater and Explorer see does not match the release version.
          $exe = 'target/release/Synector.exe'
          if (-not (Test-Path $exe)) {
              throw "Release executable not found at $exe"
          }
          $info = (Get-Item $exe).VersionInfo
          $expected = [version]"$($env:APP_VERSION).0"
          if ($info.FileVersionRaw -ne $expected -or $info.ProductVersionRaw -ne $expected) {
              throw "Executable version resources report FileVersion '$($info.FileVersionRaw)' and ProductVersion '$($info.ProductVersionRaw)', expected '$expected'."
          }
          Write-Host "Executable version resources verified: $expected"

      - name: Prepare Artifacts & Zip Portable
        id: prepare_artifacts
        shell: powershell
        run: |
          $ver = $env:APP_VERSION
          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Force -Path $distDir

          $exePath = "target/release/Synector.exe"
          if (Test-Path $exePath) {
              # Portable zip archive: the executable plus the license and notices files
              $zipTarget = "$distDir/Synector-v$ver-Windows-x64.zip"
              Compress-Archive -Path $exePath, "LICENSE", "NOTICES.md" -DestinationPath $zipTarget -Force
              Write-Host "Created $zipTarget"
          } else {
              Write-Error "Release executable not found at $exePath"
              exit 1
          }

      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SETUP_SHA256) {
              throw "Inno Setup checksum mismatch: expected $env:INNO_SETUP_SHA256, got $actual"
          }
          Write-Host 'Inno Setup checksum verified.'
          $dir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          # /PORTABLE=1 extracts the compiler without installing it or touching the registry.
          Start-Process -FilePath $exe -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir") -Wait
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) {
              throw 'Inno Setup compiler was not extracted'
          }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Installer
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          & $env:INNO_ISCC "installer/synector.iss" "/DAppVersion=$ver" "/DAppVersion4=$ver.0" "--messages-jsonl"
          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compiler failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "dist_artifacts/Synector-Setup-$ver-Windows-x64.exe")) {
              throw 'Installer artifact was not created'
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Path dist_artifacts -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path dist_artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        shell: powershell
        run: |
          if (Test-Path CHANGELOG.md) {
              $changelog = Get-Content CHANGELOG.md -Raw
              # Match notes from the first `## [` heading until the next `## [` heading or end of file
              if ($changelog -match "(?ms)^##\s+\[.*?\]\s*.*?\r?\n(.*?)(?=^##\s+\[|\z)") {
                  $notes = $matches[1].Trim()
                  Set-Content -Path "release_notes.md" -Value $notes -Encoding utf8
                  Write-Host "Extracted release notes successfully from CHANGELOG.md."
              } else {
                  Set-Content -Path "release_notes.md" -Value "Synector Release ${{ github.ref_name }}" -Encoding utf8
                  Write-Host "Fallback release notes used."
              }
          } else {
              Set-Content -Path "release_notes.md" -Value "Synector Release ${{ github.ref_name }}" -Encoding utf8
              Write-Host "Default release notes used."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Synector ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
