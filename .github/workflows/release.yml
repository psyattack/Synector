name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Artifacts & Zip Portable
        id: prepare_artifacts
        shell: powershell
        run: |
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
              $ver = $matches[1]
          } else {
              $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Force -Path $distDir

          $exePath = "target/release/Synector.exe"
          if (Test-Path $exePath) {
              # Portable zip archive
              $zipTarget = "$distDir/Synector-v$ver-Windows-x64.zip"
              Compress-Archive -Path $exePath -DestinationPath $zipTarget -Force
              Write-Host "Created $zipTarget"
          } else {
              Write-Error "Release executable not found at $exePath"
              exit 1
          }

      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $dir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          # /PORTABLE=1 extracts the compiler without installing it or touching the registry.
          Start-Process -FilePath $exe -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir") -Wait
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) {
              throw 'Inno Setup compiler was not extracted'
          }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Installer
        shell: pwsh
        run: |
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch 'version\s*=\s*"([^"]+)"') {
              throw 'Unable to read the version from Cargo.toml'
          }
          $ver = $matches[1]
          & $env:INNO_ISCC "installer/synector.iss" "/DAppVersion=$ver" "/DAppVersion4=$ver.0" "--messages-jsonl"
          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compiler failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "dist_artifacts/Synector-Setup-$ver-Windows-x64.exe")) {
              throw 'Installer artifact was not created'
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Path dist_artifacts -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path dist_artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        shell: powershell
        run: |
          if (Test-Path CHANGELOG.md) {
              $changelog = Get-Content CHANGELOG.md -Raw
              # Match notes from the first `## [` heading until the next `## [` heading or end of file
              if ($changelog -match "(?ms)^##\s+\[.*?\]\s*.*?\r?\n(.*?)(?=^##\s+\[|\z)") {
                  $notes = $matches[1].Trim()
                  Set-Content -Path "release_notes.md" -Value $notes -Encoding utf8
                  Write-Host "Extracted release notes successfully from CHANGELOG.md."
              } else {
                  Set-Content -Path "release_notes.md" -Value "Synector Release ${{ github.ref_name }}" -Encoding utf8
                  Write-Host "Fallback release notes used."
              }
          } else {
              Set-Content -Path "release_notes.md" -Value "Synector Release ${{ github.ref_name }}" -Encoding utf8
              Write-Host "Default release notes used."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Synector ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
