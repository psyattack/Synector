[package]
name = "Synector"
version = "3.2.0"
edition = "2021"
authors = ["psyattack"]
description = "Native Windows automation suite and process supervisor in pure Rust"
license = "MIT"
repository = "https://github.com/psyattack/Synector"
homepage = "https://psyattack.github.io/Synector/"

[[bin]]
name = "Synector"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
# Maintained fork of egui-phosphor for egui 0.37; switch back when upstream catches up.
egui-pop-phosphor = "0.15"
egui_extras = { version = "0.37", features = ["default", "all_loaders"] }
rfd = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
flate2 = "1.1.11"
brotli = "9.1.3"
base64 = "0.23.1"
arboard = "3.7.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
regex = "1.13.2"
sha2 = "0.11.1"
schemars = { version = "1.2.3", features = ["derive"] }

[build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_WindowsProgramming",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }
